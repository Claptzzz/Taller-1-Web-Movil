<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alimentación</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="../assets/img/icon-sleepwell.ico" type="image/x-icon">
    
    <style type="text/tailwindcss">
        @theme {
            --color-OatmilkFoam: #F8F4EF;
            --color-DeepSlate: #40434E;
            --color-DeepSlateDark: #353741;
            --color-DeepSlateLight: #5E6373;
        }
        
        /* Ocultar el scroll del dialog para que se vea como modal nativo */
        dialog::backdrop {
            background-color: rgba(64, 67, 78, 0.8);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-OatmilkFoam text-DeepSlate flex flex-col min-h-screen overflow-x-hidden pb-24 font-sans selection:bg-sky-200">

    <!-- TOP APP BAR -->
    <header class="sticky top-0 z-40 w-full bg-OatmilkFoam/90 backdrop-blur-md px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <svg class="h-6 w-6 text-DeepSlate"><use xlink:href="../assets/img/sprites.svg#documento-icon" /></svg>
            <h1 class="font-bold text-xl tracking-tighter uppercase">ALIMENTACIÓN</h1>
        </div>
        <!-- Enlaces ocultos requeridos por navbar.js -->
        <a id="logo_link" href="../index.html" class="hidden"></a>
        <a id="perfil_link" href="perfil.html" class="hidden"></a>
    </header>

    <main class="w-full max-w-md mx-auto mt-6 px-4 flex-grow flex flex-col gap-6">
        
        <!-- SECCIÓN: AGUA -->
        <article class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <h2 class="text-sm font-bold mb-4 text-DeepSlateLight uppercase tracking-wider">Ingesta de agua</h2>
            <form class="flex gap-4">
                <div class="flex flex-col gap-1 w-1/2">
                    <label class="text-xs font-bold uppercase opacity-70 ml-1">Recomendado</label>
                    <input type="text" placeholder="2.5L" class="h-12 bg-gray-50 text-gray-500 border border-gray-200 p-2 rounded-2xl w-full outline-none font-bold text-center" readonly>
                </div>
                <div class="flex flex-col gap-1 w-1/2">
                    <label class="text-xs font-bold uppercase text-sky-600 ml-1">Actual</label>
                    <input type="text" placeholder="1.2L" class="h-12 bg-sky-50 text-sky-700 border-2 border-sky-200 p-2 rounded-2xl w-full outline-none font-bold text-center focus:border-sky-500 transition-all">
                </div>
            </form>
        </article>

        <!-- SECCIÓN: HÁBITOS -->
        <article class="bg-white p-2 rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <h2 class="text-sm font-bold m-4 text-DeepSlateLight uppercase tracking-wider">Hábitos Diarios</h2>
            <ul class="flex flex-col">
                <!--VEGETALES -->
                <li class="flex items-center gap-4 p-4 hover:bg-gray-50 transition-colors border-b border-gray-100 last:border-0">
                    <input type="checkbox" class="w-6 h-6 rounded-md border-gray-300 text-sky-600 focus:ring-sky-500 cursor-pointer">
                    <span class="text-base font-medium">¿Comí vegetales hoy?</span>
                </li>
                <!--AZUCAR -->
                <li class="flex items-center gap-4 p-4 hover:bg-gray-50 transition-colors border-b border-gray-100 last:border-0">
                    <input type="checkbox" class="w-6 h-6 rounded-md border-gray-300 text-sky-600 focus:ring-sky-500 cursor-pointer">
                    <span class="text-base font-medium">¿Evité excesos de azúcar?</span>
                </li>
                <!--PROTEINA -->
                <li class="flex items-center gap-4 p-4 hover:bg-gray-50 transition-colors border-b border-gray-100 last:border-0">
                    <input type="checkbox" class="w-6 h-6 rounded-md border-gray-300 text-sky-600 focus:ring-sky-500 cursor-pointer">
                    <span class="text-base font-medium">¿Consumí proteína?</span>
                </li>
                <!--FRUTA -->
                <li class="flex items-center gap-4 p-4 hover:bg-gray-50 transition-colors">
                    <input type="checkbox" class="w-6 h-6 rounded-md border-gray-300 text-sky-600 focus:ring-sky-500 cursor-pointer">
                    <span class="text-base font-medium">¿Consumí fruta?</span>
                </li>
            </ul>
        </article>

        <!-- SECCIÓN DE COMIDAS -->
        <section class="flex flex-col gap-4 mb-6">
            <h2 class="text-sm font-bold mt-2 mb-1 text-DeepSlateLight uppercase tracking-wider px-2">Tus Comidas</h2>
            
            <!-- DESAYUNO -->
            <article class="bg-DeepSlate p-5 rounded-3xl shadow-md text-white flex flex-col" data-meal="desayuno">
                <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                    <h3 class="text-sky-200 text-lg font-bold uppercase tracking-widest">Desayuno</h3>
                    <button type="button" onclick="openModal('desayuno')" class="bg-white/10 hover:bg-white/20 h-10 w-10 flex items-center justify-center rounded-full transition-all active:scale-90 font-bold text-xl">+</button>
                </div>
                <ul class="foods w-full flex flex-col gap-3 list-none min-h-[20px]"></ul>
            </article>

            <!-- ALMUERZO -->
            <article class="bg-DeepSlate p-5 rounded-3xl shadow-md text-white flex flex-col" data-meal="almuerzo">
                <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                    <h3 class="text-sky-200 text-lg font-bold uppercase tracking-widest">Almuerzo</h3>
                    <button type="button" onclick="openModal('almuerzo')" class="bg-white/10 hover:bg-white/20 h-10 w-10 flex items-center justify-center rounded-full transition-all active:scale-90 font-bold text-xl">+</button>
                </div>
                <ul class="foods w-full flex flex-col gap-3 list-none min-h-[20px]"></ul>
            </article>

            <!-- CENA -->
            <article class="bg-DeepSlate p-5 rounded-3xl shadow-md text-white flex flex-col" data-meal="cena">
                <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                    <h3 class="text-sky-200 text-lg font-bold uppercase tracking-widest">Cena</h3>
                    <button type="button" onclick="openModal('cena')" class="bg-white/10 hover:bg-white/20 h-10 w-10 flex items-center justify-center rounded-full transition-all active:scale-90 font-bold text-xl">+</button>
                </div>
                <ul class="foods w-full flex flex-col gap-3 list-none min-h-[20px]"></ul>
            </article>

            <!-- SNACKS -->
            <article class="bg-DeepSlate p-5 rounded-3xl shadow-md text-white flex flex-col" data-meal="snacks">
                <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                    <h3 class="text-sky-200 text-lg font-bold uppercase tracking-widest">Snacks</h3>
                    <button type="button" onclick="openModal('snacks')" class="bg-white/10 hover:bg-white/20 h-10 w-10 flex items-center justify-center rounded-full transition-all active:scale-90 font-bold text-xl">+</button>
                </div>
                <ul class="foods w-full flex flex-col gap-3 list-none min-h-[20px]"></ul>
            </article>
        </section>

    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav id="main_nav" class="fixed bottom-0 w-full bg-DeepSlate rounded-t-[2rem] shadow-[0_-10px_40px_rgba(0,0,0,0.15)] flex justify-around items-center px-4 py-2 z-50 border-t border-white/5 pb-[env(safe-area-inset-bottom,16px)] text-OatmilkFoam"></nav>

    <!-- Modal para agregar comida (Bottom Sheet Native Style) -->
    <dialog id="mealModal" class="mt-auto mb-0 mx-auto w-full max-w-md rounded-t-4xl rounded-b-none p-6 shadow-2xl backdrop:bg-black/50 backdrop:backdrop-blur-sm bg-white animate-[slideUp_0.3s_ease-out] m-0 border-t border-gray-100">
        <h3 class="text-xl font-bold mb-4 text-DeepSlate uppercase tracking-tighter text-center">¿Qué comiste?</h3>
        <input type="text" id="foodDescription" class="w-full bg-gray-50 border border-gray-200 text-DeepSlate p-4 rounded-2xl outline-none focus:border-sky-400 transition-all font-medium text-lg text-center" placeholder="Ej. Manzana y Avena">
        
        <!-- Botón y Vista Previa de Cámara -->
        <div class="mt-4 flex flex-col items-center">
            <img id="foodImagePreview" class="hidden w-full h-40 object-cover rounded-2xl mb-3 shadow-sm border border-gray-200">
            <button type="button" onclick="takePhoto()" class="flex items-center justify-center gap-2 w-full bg-sky-50 text-sky-600 font-bold min-h-[48px] rounded-2xl hover:bg-sky-100 active:scale-95 transition-all uppercase tracking-wider text-sm border border-sky-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Tomar Foto
            </button>
        </div>

        <p id="mealError" hidden class="text-xs text-red-600 font-medium text-center mt-3" aria-live="polite"></p>

        <div class="flex gap-3 mt-6">
            <button type="button" onclick="closeModal()" class="w-1/3 bg-gray-100 text-DeepSlateLight font-bold min-h-[56px] rounded-2xl hover:bg-gray-200 active:scale-95 transition-all uppercase tracking-wider">Cancelar</button>
            <button type="button" onclick="addFood()" class="w-2/3 bg-DeepSlate text-white font-bold min-h-[56px] rounded-2xl shadow-md hover:bg-DeepSlateDark active:scale-95 transition-all uppercase tracking-wider">Guardar</button>
        </div>
    </dialog>

    <style>
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>

    <script src="../assets/js/navbar.js"></script>
    <script src="../assets/js/alimentacion.js"></script>
</body>
</html>
