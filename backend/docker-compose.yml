services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: taller1-backend:latest
    container_name: taller1-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/prod.db"
      JWT_SECRET: "change-me-in-production"
      PORT: "3000"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  backend-data:
