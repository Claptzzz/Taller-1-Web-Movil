<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Actividades</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="../assets/img/icon-sleepwell.ico" type="image/x-icon">
    
    
    <style type="text/tailwindcss">
        @theme {
            --color-OatmilkFoam: #F8F4EF;
            --color-DeepSlate: #40434E;
            --color-DeepSlateDark: #353741;
            --color-DeepSlateLight: #5E6373;
        }
    </style>
</head>
<body class="bg-OatmilkFoam flex flex-col min-h-screen items-center m-auto px-4">

    <!--HEADER GLOSSY--> <!--ULTIMA VERSION DEL HEADER-->
    <header class="flex sticky top-5 z-50 w-[95%] lg:w-3xl mx-auto mt-5 p-3 px-6 justify-between items-center rounded-3xl bg-DeepSlate/80 backdrop-blur-md border border-white/10 shadow-xl text-OatmilkFoam max-sm:flex-col gap-4">
        <a id="logo_link" href="../index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
            <svg class="h-7 w-7">
                <use xlink:href="../assets/img/sprites.svg#logo-icon" />
            </svg>
            <h1 class="font-bold text-xl tracking-tighter">SLEEPWELL</h1>
        </a>
        <div class="flex flex-row justify-between items-center">
            <nav id="main_nav" class="flex flex-row gap-2 text-sm font-medium">
                <a href="../index.html#hero" class="hover:bg-white/10 px-4 py-2 rounded-xl transition-all">INICIO</a>
                <a href="../index.html#how_to_use" class="hover:bg-white/10 px-4 py-2 rounded-xl transition-all">MÉTODO</a>
                <a href="../index.html#about" class="hover:bg-white/10 px-4 py-2 rounded-xl transition-all">NOSOTROS</a>
            </nav>
            <div id="perfil" class="ml-4">
                <a id="perfil_link" href="perfil.html" class="hover:text-sky-200 transition-colors">
                    <svg class="h-7 w-7">
                        <use xlink:href="../assets/img/sprites.svg#user-icon" />
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL: CALENDARIO Y ORGANIZADOR -->
    <main class="w-full max-w-5xl mt-16 flex flex-col lg:flex-row gap-8 pb-20">
        
        <!-- SECCIÓN CALENDARIO -->
        <section class="bg-DeepSlate p-8 rounded-[2.5rem] shadow-2xl flex-grow border border-white/5">
            <header class="flex justify-between items-center mb-8 text-OatmilkFoam">
                <h2 class="text-2xl font-black uppercase tracking-tighter italic">Abril 2026</h2>
                <nav class="flex gap-4">
                    <button class="bg-white/10 hover:bg-white/20 p-2 rounded-xl transition-all cursor-pointer">&larr;</button>
                    <button class="bg-white/10 hover:bg-white/20 p-2 rounded-xl transition-all cursor-pointer">&rarr;</button>
                </nav>
            </header>

            <table class="w-full text-OatmilkFoam border-separate border-spacing-2">
                <thead>
                    <tr class="text-xs font-bold uppercase opacity-50">
                        <th class="pb-4">Lun</th>
                        <th class="pb-4">Mar</th>
                        <th class="pb-4">Mié</th>
                        <th class="pb-4">Jue</th>
                        <th class="pb-4">Vie</th>
                        <th class="pb-4">Sáb</th>
                        <th class="pb-4">Dom</th>
                    </tr>
                </thead>
                <tbody class="text-center font-bold">
                    <!-- Ejemplo de días del calendario -->
                    <tr>
                        <td class="p-3 bg-white/5 rounded-2xl opacity-30 italic">30</td>
                        <td class="p-3 bg-white/5 rounded-2xl opacity-30 italic">31</td>
                        <td class="p-3 bg-white/10 hover:bg-sky-200 hover:text-DeepSlate rounded-2xl transition-all cursor-pointer">1</td>
                        <td class="p-3 bg-white/10 hover:bg-sky-200 hover:text-DeepSlate rounded-2xl transition-all cursor-pointer">2</td>
                        <td class="p-3 bg-white/10 hover:bg-sky-200 hover:text-DeepSlate rounded-2xl transition-all cursor-pointer text-sky-200 border border-sky-200/50">3</td>
                        <td class="p-3 bg-white/10 hover:bg-sky-200 hover:text-DeepSlate rounded-2xl transition-all cursor-pointer">4</td>
                        <td class="p-3 bg-white/10 hover:bg-sky-200 hover:text-DeepSlate rounded-2xl transition-all cursor-pointer">5</td>
                    </tr>
                    <!-- ... Más filas representadas ... -->
                    <tr>
                        <td class="p-3 bg-white/10 hover:bg-sky-200 hover:text-DeepSlate rounded-2xl transition-all cursor-pointer">6</td>
                        <td class="p-3 bg-white/10 hover:bg-sky-200 hover:text-DeepSlate rounded-2xl transition-all cursor-pointer">7</td>
                        <td class="p-3 bg-white/10 hover:bg-sky-200 hover:text-DeepSlate rounded-2xl transition-all cursor-pointer">8</td>
                        <td class="p-3 bg-white/10 hover:bg-sky-200 hover:text-DeepSlate rounded-2xl transition-all cursor-pointer">9</td>
                        <td class="p-3 bg-white/10 hover:bg-sky-200 hover:text-DeepSlate rounded-2xl transition-all cursor-pointer font-black ring-2 ring-OatmilkFoam">10</td>
                        <td class="p-3 bg-white/10 hover:bg-sky-200 hover:text-DeepSlate rounded-2xl transition-all cursor-pointer">11</td>
                        <td class="p-3 bg-white/10 hover:bg-sky-200 hover:text-DeepSlate rounded-2xl transition-all cursor-pointer text-sky-200">12</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- SECCIÓN AGREGAR / LISTADO DEL DÍA -->
        <aside class="flex flex-col gap-6 w-full lg:w-96">
            <article class="bg-DeepSlateLight p-8 rounded-[2.5rem] text-OatmilkFoam shadow-xl">
                <h3 class="text-xl font-bold mb-6 uppercase tracking-widest border-b border-white/10 pb-2 text-center">Hoy: Viernes 10</h3>
                
                <form class="flex flex-col gap-4">
                    <label class="flex flex-col gap-2 italic text-sm">
                        Nueva Actividad
                        <input type="text" placeholder="Ej: Running 5km" class="bg-OatmilkFoam text-DeepSlate p-3 rounded-xl font-bold outline-none">
                    </label>
                    <label class="flex flex-col gap-2 italic text-sm">
                        Hora
                        <input type="time" class="bg-OatmilkFoam text-DeepSlate p-3 rounded-xl font-bold outline-none">
                    </label>
                    <button type="button" class="mt-2 bg-DeepSlate text-OatmilkFoam font-black py-4 rounded-2xl border-2 border-OatmilkFoam hover:bg-OatmilkFoam hover:text-DeepSlate transition-all uppercase tracking-widest text-xs">
                        AGREGAR AL DÍA
                    </button>
                </form>
            </article>

            <article class="bg-white p-6 rounded-[2.5rem] shadow-lg border border-DeepSlate/5 flex-grow">
                <h4 class="font-black text-DeepSlate uppercase text-center mb-6 tracking-tighter">Planificación del día</h4>
                <ul class="flex flex-col gap-3">
                    <li class="flex justify-between items-center bg-OatmilkFoam p-4 rounded-2xl border-l-4 border-DeepSlate">
                        <span class="font-bold text-DeepSlate text-sm uppercase italic">Yoga matutino</span>
                        <span class="text-xs font-black opacity-50 uppercase tracking-tighter">07:00 AM</span>
                    </li>
                    <li class="flex justify-between items-center bg-OatmilkFoam p-4 rounded-2xl border-l-4 border-sky-400">
                        <span class="font-bold text-DeepSlate text-sm uppercase italic">Snack saludable</span>
                        <span class="text-xs font-black opacity-50 uppercase tracking-tighter">11:30 AM</span>
                    </li>
                </ul>
            </article>
        </aside>

    </main>

    <script src="../assets/js/navbar.js"></script>
    <script src="../assets/js/actividades.js"></script>
</body>
</html>
